background {
    monitor = eDP-1                # change to your monitor name
    path = /usr/share/backgrounds/archlinux/archbtw.png
    blur_passes = 2                # adds a little blur, can set to 0 for flat
    blur_size = 7
}

input-field {
    monitor = eDP-1
    size = 200, 40
    position = 0, -40
    halign = center
    valign = center

    dots = true
    fade_on_empty = false
    font_size = 14

    outline_thickness = 2
    inner_color = rgba(30, 30, 46, 0.7)
    outer_color = rgba(245, 194, 231, 0.8)
}

label {
    monitor = eDP-1
    text = cmd[date +'%H:%M']
    font_size = 48
    position = 0, -150
    halign = center
    valign = center
}
